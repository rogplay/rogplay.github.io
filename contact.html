<!DOCTYPE html>
<html lang="en" class="dark">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Us - Rogplay</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>

  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Outfit', 'sans-serif'],
          },
          colors: {
            background: '#030712',
            surface: '#111827',
            primary: '#0ea5e9',
            secondary: '#8b5cf6'
          },
          animation: {
            'blob': 'blob 7s infinite',
          },
          keyframes: {
            blob: {
              '0%': { transform: 'translate(0px, 0px) scale(1)' },
              '33%': { transform: 'translate(30px, -50px) scale(1.1)' },
              '66%': { transform: 'translate(-20px, 20px) scale(0.9)' },
              '100%': { transform: 'translate(0px, 0px) scale(1)' },
            }
          }
        }
      }
    }
  </script>
  <style>
    body {
      background-color: #030712;
      color: #f3f4f6;
    }
    .glass-card {
      background: rgba(17, 24, 39, 0.7);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.05);
      transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .glass-card:hover {
      border-color: rgba(14, 165, 233, 0.4);
      transform: translateY(-4px);
      box-shadow: 0 12px 40px -10px rgba(14, 165, 233, 0.2);
    }
    .glass-nav {
      background: rgba(3, 7, 18, 0.8);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
    }
    ::-webkit-scrollbar {
      width: 8px;
    }
    ::-webkit-scrollbar-track {
      background: #030712;
    }
    ::-webkit-scrollbar-thumb {
      background: #374151;
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #4b5563;
    }
  </style>
</head>

<body class="min-h-screen flex flex-col relative overflow-x-hidden antialiased">
  <div class="fixed inset-0 z-[-1] overflow-hidden pointer-events-none">
    <div
      class="absolute top-0 left-1/4 w-96 h-96 bg-primary/20 rounded-full mix-blend-screen filter blur-[100px] opacity-50 animate-blob">
    </div>
    <div
      class="absolute top-1/4 right-1/4 w-96 h-96 bg-secondary/20 rounded-full mix-blend-screen filter blur-[100px] opacity-50 animate-blob animation-delay-2000">
    </div>
    <div
      class="absolute -bottom-32 left-1/2 w-96 h-96 bg-purple-500/20 rounded-full mix-blend-screen filter blur-[100px] opacity-50 animate-blob animation-delay-4000">
    </div>
  </div>

  <header class="fixed top-0 w-full z-50 glass-nav transition-all duration-300">
    <div class="container mx-auto px-4 lg:px-8 py-4">
      <nav class="flex items-center justify-between">
        <a href="index.html" class="flex items-center gap-3 group">
          <div class="relative h-10 w-10 flex items-center justify-center transition-transform duration-300 group-hover:scale-105">
            <img src="https://raw.githubusercontent.com/rogplay/rogplay.github.io/refs/heads/main/assets/rogplay.svg" alt="Rogplay Logo" class="w-full h-full object-contain" />
          </div>
          <span
            class="text-2xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-white to-gray-400 tracking-tight">
            ROGPLAY
          </span>
        </a>

        <div class="hidden md:flex items-center gap-8">
          <a href="index.html#home" class="text-gray-300 hover:text-white transition-colors text-sm font-medium">Home</a>
          <a href="index.html#addons" class="text-gray-300 hover:text-white transition-colors text-sm font-medium">Addons</a>
          <a href="index.html#tutorial" class="text-gray-300 hover:text-white transition-colors text-sm font-medium">Tutorial</a>
          <a href="index.html#api" class="text-gray-300 hover:text-white transition-colors text-sm font-medium">Developers</a>
          <a href="https://telegram.me/rogplayaddons" target="_blank"
            class="px-5 py-2.5 rounded-lg bg-white/10 hover:bg-white/20 text-white text-sm font-medium transition-all flex items-center gap-2 border border-white/5">
            <i data-lucide="send" class="w-4 h-4"></i>
            Join Community
          </a>
        </div>

        <button id="menu-toggle"
          class="md:hidden text-gray-300 hover:text-white focus:outline-none p-2 bg-white/5 rounded-lg border border-white/10">
          <i data-lucide="menu" class="w-6 h-6"></i>
        </button>
      </nav>
    </div>

    <div id="mobile-menu"
      class="hidden md:hidden absolute top-full left-0 w-full glass-nav border-t border-white/5 py-4 px-4 flex-col gap-4 shadow-2xl">
      <a href="index.html#home"
        class="mobile-link text-gray-300 hover:text-white transition-colors p-3 rounded-lg hover:bg-white/5 flex items-center gap-3">
        <i data-lucide="home" class="w-5 h-5 text-primary"></i> Home
      </a>
      <a href="index.html#addons"
        class="mobile-link text-gray-300 hover:text-white transition-colors p-3 rounded-lg hover:bg-white/5 flex items-center gap-3">
        <i data-lucide="grid" class="w-5 h-5 text-secondary"></i> Addons
      </a>
      <a href="index.html#tutorial"
        class="mobile-link text-gray-300 hover:text-white transition-colors p-3 rounded-lg hover:bg-white/5 flex items-center gap-3">
        <i data-lucide="play-circle" class="w-5 h-5 text-emerald-400"></i> Tutorial
      </a>
      <a href="index.html#api"
        class="mobile-link text-gray-300 hover:text-white transition-colors p-3 rounded-lg hover:bg-white/5 flex items-center gap-3">
        <i data-lucide="code" class="w-5 h-5 text-amber-400"></i> Developers
      </a>
      <a href="https://telegram.me/rogplayaddons" target="_blank"
        class="mt-2 px-4 py-3 rounded-xl bg-gradient-to-r from-primary to-secondary text-white text-center font-medium shadow-lg flex items-center justify-center gap-2">
        <i data-lucide="send" class="w-5 h-5"></i>
        Join Community Telegram
      </a>
    </div>
  </header>

  <main class="pt-32 pb-16 px-4 flex-grow relative z-10">
    <div class="container mx-auto max-w-2xl glass-card rounded-3xl p-8 md:p-12">
        <h1 class="text-4xl md:text-5xl font-bold mb-8 text-white tracking-tight text-center">Contact Us</h1>
        <p class="mb-8 text-gray-400 text-lg leading-relaxed text-center">Have any questions or concerns? Reach out to us, and we'll get back to you as
            soon as possible.</p>
        <form action="mailto:kunwarxshashank@gmail.com" method="POST" enctype="text/plain" class="space-y-6">
            <div>
                <label class="block text-gray-300 text-sm font-medium mb-2" for="name">Your Name</label>
                <input type="text" id="name" name="name"
                    class="w-full px-4 py-3 bg-black/20 border border-white/10 rounded-xl focus:outline-none focus:ring-2 focus:ring-primary focus:border-primary text-white placeholder-gray-500 transition-all"
                    placeholder="John Doe" required>
            </div>
            <div>
                <label class="block text-gray-300 text-sm font-medium mb-2" for="email">Your Email</label>
                <input type="email" id="email" name="email"
                    class="w-full px-4 py-3 bg-black/20 border border-white/10 rounded-xl focus:outline-none focus:ring-2 focus:ring-primary focus:border-primary text-white placeholder-gray-500 transition-all"
                    placeholder="john@example.com" required>
            </div>
            <div>
                <label class="block text-gray-300 text-sm font-medium mb-2" for="message">Your Message</label>
                <textarea id="message" name="message" rows="5"
                    class="w-full px-4 py-3 bg-black/20 border border-white/10 rounded-xl focus:outline-none focus:ring-2 focus:ring-primary focus:border-primary text-white placeholder-gray-500 transition-all"
                    placeholder="How can we help you?" required></textarea>
            </div>
            <button type="submit"
                class="w-full bg-gradient-to-r from-primary to-secondary hover:shadow-lg hover:shadow-primary/25 text-white font-medium py-4 px-6 rounded-xl transition-all duration-300 flex items-center justify-center gap-2">
                <i data-lucide="send" class="w-5 h-5"></i>
                Send Message
            </button>
        </form>
    </div>
  </main>

  <footer class="border-t border-white/5 bg-black/40 backdrop-blur-xl py-12 px-4 mt-auto">
    <div class="container mx-auto max-w-7xl">
      <div class="flex flex-col md:flex-row justify-between items-center gap-6">
        <div class="flex items-center gap-3">
          <div class="h-8 w-8 bg-gradient-to-br from-primary to-secondary rounded-lg flex items-center justify-center">
            <i data-lucide="play" class="w-4 h-4 text-white fill-white"></i>
          </div>
          <span class="text-xl font-bold text-white tracking-tight">ROGPLAY</span>
        </div>

        <div class="flex gap-6 text-sm text-gray-400">
          <a href="privacypolicy.html" class="hover:text-white transition-colors">Privacy Policy</a>
          <a href="contact.html" class="hover:text-white transition-colors">Contact</a>
          <a href="about.html" class="hover:text-white transition-colors">About Us</a>
        </div>

        <div class="text-sm text-gray-500">
          © <span id="year"></span> Rogplay. All rights reserved.
        </div>
      </div>
    </div>
  </footer>

  <script>
    lucide.createIcons();
    document.getElementById('year').textContent = new Date().getFullYear();

    const menuToggle = document.getElementById('menu-toggle');
    const mobileMenu = document.getElementById('mobile-menu');
    const mobileLinks = document.querySelectorAll('.mobile-link');

    menuToggle.addEventListener('click', () => {
      mobileMenu.classList.toggle('hidden');
      mobileMenu.classList.toggle('flex');
    });

    mobileLinks.forEach(link => {
      link.addEventListener('click', () => {
        mobileMenu.classList.add('hidden');
        mobileMenu.classList.remove('flex');
      });
    });

    const header = document.querySelector('header');
    window.addEventListener('scroll', () => {
      if (window.scrollY > 20) {
        header.classList.add('shadow-2xl');
      } else {
        header.classList.remove('shadow-2xl');
      }
    });
  </script>
</body>

</html>
